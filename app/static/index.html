<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#12140f" />
    <title>Cast Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="shell">
      <header class="top">
        <p class="brand">Cast Hub</p>
        <p class="tagline">Pick a video on your Mac. Send it to the TV.</p>
      </header>

      <section class="panel" aria-labelledby="tv-heading">
        <div class="panel-head">
          <h2 id="tv-heading">TV</h2>
          <button type="button" class="ghost" id="refresh-devices">Scan</button>
        </div>
        <div id="devices" class="device-list" role="listbox" aria-label="Cast devices"></div>
        <p class="hint" id="device-hint">Scanning your Wi‑Fi for Cast devices…</p>
      </section>

      <section class="panel" aria-labelledby="library-heading">
        <div class="panel-head">
          <h2 id="library-heading">Library</h2>
          <button type="button" class="ghost" id="refresh-videos">Reload</button>
        </div>
        <div id="videos" class="video-list" role="listbox" aria-label="Videos"></div>
        <p class="hint" id="video-hint">Loading videos from this Mac…</p>
      </section>

      <section class="now" id="now-playing" hidden>
        <div class="now-copy">
          <p class="now-label">Now playing</p>
          <p class="now-title" id="now-title">—</p>
          <p class="now-meta" id="now-meta"></p>
        </div>
        <div class="controls">
          <button type="button" class="ctrl" id="btn-pause" aria-label="Pause">Pause</button>
          <button type="button" class="ctrl" id="btn-resume" aria-label="Resume">Play</button>
          <button type="button" class="ctrl danger" id="btn-stop" aria-label="Stop">Stop</button>
        </div>
        <label class="volume">
          <span>Volume</span>
          <input id="volume" type="range" min="0" max="100" value="50" />
        </label>
      </section>

      <p class="status" id="status" role="status"></p>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
